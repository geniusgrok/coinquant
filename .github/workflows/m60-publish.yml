name: Publish verified M60 source
on:
  push:
    branches: [research/m60-20260923]
    paths: ['.github/workflows/m60-publish.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: research/m60-20260923
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Verify exact patch base and target bytes
        run: |
          test "$(git hash-object research/persistent_hold_replay.py)" = 50257aaad12f11a6bff75d1f9796dae9aab878ca
          echo '56b6a308f2afb4022e6e5b70bbffc1677a42e7bb6d2d6798edbb053b94cd58de  .m60-publication/shared.patch' | sha256sum -c -
          git apply --check --unidiff-zero .m60-publication/shared.patch
          git apply --unidiff-zero .m60-publication/shared.patch
          python - <<'PY'
          import hashlib,pathlib,subprocess
          expected={'coinquant/multiscale.py':'14cc6890784c9de7719e4444fe2293da89ab3813','research/multiscale_data.py':'447584efffcfbcab1fa48f4b23648cb5f0b64e90','research/multiscale_replay.py':'c76c8112f685472ec85266ecba26c413ef84bef9','tests/test_multiscale.py':'970109edd6566f1262972f56f81c884892f0be9d','research/persistent_hold_replay.py':'b7a1d38f1dd813a9cb0090b2faa835c2a268f72d'}
          for path,oid in expected.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==oid,path
          PY
          python -m compileall -q coinquant research tests
          python -m unittest discover -s tests > /tmp/m60-tests.log 2>&1
          tail -5 /tmp/m60-tests.log
      - name: Commit actual source and remove publishing scaffolding
        run: |
          git config user.name geniusgrok
          git config user.email flyvarfdu@gmail.com
          git rm .m60-publication/shared.patch .github/workflows/m60-publish.yml
          git add research/persistent_hold_replay.py
          git commit -m 'research: materialize verified M60 shared replay source'
          git push origin HEAD:refs/heads/research/m60-20260923
      - name: Export exact published workspace
        run: |
          mkdir -p /tmp/m60-export
          git archive HEAD | gzip > /tmp/m60-export/workspace.tar.gz
          git rev-parse HEAD HEAD^{tree} > /tmp/m60-export/IDENTITY.txt
          git ls-tree -r HEAD > /tmp/m60-export/TREE.txt
          cp /tmp/m60-tests.log /tmp/m60-export/TESTS.log
          cd /tmp/m60-export && sha256sum workspace.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coinquant-m60-source-${{ github.sha }}
          path: /tmp/m60-export/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
