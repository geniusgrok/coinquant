name: Check
on:
  push:
    branches: [main, research/on-demand-btc-20260920]
    paths:
      - 'pancakequant/**'
      - 'tests/**'
      - 'main.py'
      - 'config.example.json'
      - 'research/spec.json'
      - 'research/probe.py'
      - '.github/workflows/check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pancakequant-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Preserve immutable current source
        run: |
          mkdir -p "$RUNNER_TEMP/pancakequant-check"
          git rev-parse HEAD > "$RUNNER_TEMP/pancakequant-check/HEAD.txt"
          git archive --format=tar HEAD > "$RUNNER_TEMP/pancakequant-check/source.tar"
          cd "$RUNNER_TEMP/pancakequant-check"
          sha256sum source.tar > SHA256SUMS
      - name: One requested public schema probe
        if: github.event.head_commit.message == 'Check public BTCUSD endpoints'
        run: python research/probe.py --output "$RUNNER_TEMP/pancakequant-check/public"
      - name: Compile and run targeted offline checks
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q pancakequant tests
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/pancakequant-check/tests.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checked-source-${{ github.sha }}
          path: ${{ runner.temp }}/pancakequant-check/
          if-no-files-found: error
          retention-days: 30
