name: Preserve and check research source
on:
  push:
    branches: [research/on-demand-btc-20260920]
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: research/on-demand-btc-20260920
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Reconstruct source and verify remote bytes
        run: python .transfer/materialize.py
