name: Check
on:
  push:
    branches: [main, research/on-demand-btc-20260920]
    paths:
      - 'pancakequant/**'
      - 'tests/**'
      - 'main.py'
      - 'config.example.json'
      - 'research/**'
      - '.github/workflows/check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pancakequant-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event.head_commit.message != 'Acquire native BTCUSD history'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Preserve immutable current source
        run: |
          mkdir -p "$RUNNER_TEMP/pancakequant-check"
          git rev-parse HEAD > "$RUNNER_TEMP/pancakequant-check/HEAD.txt"
          git archive --format=tar HEAD > "$RUNNER_TEMP/pancakequant-check/source.tar"
          cd "$RUNNER_TEMP/pancakequant-check"
          sha256sum source.tar > SHA256SUMS
      - name: Compile and run targeted offline checks
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q pancakequant research tests
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/pancakequant-check/tests.txt"
      - name: One requested public schema probe
        if: github.event.head_commit.message == 'Check public BTCUSD endpoints'
        run: python research/probe.py --output "$RUNNER_TEMP/pancakequant-check/public"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checked-source-${{ github.sha }}
          path: ${{ runner.temp }}/pancakequant-check/
          if-no-files-found: error
          retention-days: 30

  acquire:
    if: github.event.head_commit.message == 'Acquire native BTCUSD history'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Acquire public native BTCUSD history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pancakequant-history"
          ok=0
          for attempt in 1 2 3; do
            if python -m research.acquire_v5 \
              --output "$RUNNER_TEMP/pancakequant-history" \
              --api-host api.manepa.jp \
              --start 2019-12-11 \
              --end 2026-09-20 \
              --interval-minutes 60 \
              --shard-days 30 \
              --timeout 8 \
              --pause 0.02; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "pancakequant-history"
          result = json.loads((root / "v5-result.json").read_text())
          inventory = json.loads((root / "v5-inventory.json").read_text())
          assert result["status"] == "complete", result
          assert result["failed_shards"] == 0, result
          assert inventory["api_host"] == "api.manepa.jp"
          assert inventory["start"] == "2019-12-11"
          assert inventory["end_exclusive"] == "2026-09-20"
          assert inventory["bar_interval_ms"] == 3600000
          print(json.dumps({
              "complete_shards": result["complete_shards"],
              "failed_shards": result["failed_shards"],
              "bar_interval_ms": result["bar_interval_ms"],
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-btcusd-history-${{ github.sha }}
          path: ${{ runner.temp }}/pancakequant-history/
          if-no-files-found: warn
          retention-days: 30
