name: Check
on:
  push:
    branches: [main, research/on-demand-btc-20260920]
    paths:
      - 'pancakequant/**'
      - 'tests/**'
      - 'main.py'
      - 'config.example.json'
      - 'research/**'
      - '.github/workflows/check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pancakequant-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event.head_commit.message != 'Preserve native BTCUSD artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Preserve immutable current source
        run: |
          mkdir -p "$RUNNER_TEMP/pancakequant-check"
          git rev-parse HEAD > "$RUNNER_TEMP/pancakequant-check/HEAD.txt"
          git archive --format=tar HEAD > "$RUNNER_TEMP/pancakequant-check/source.tar"
          cd "$RUNNER_TEMP/pancakequant-check"
          sha256sum source.tar > SHA256SUMS
      - name: Compile and run targeted offline checks
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q pancakequant research tests
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/pancakequant-check/tests.txt"
      - name: One requested public schema probe
        if: github.event.head_commit.message == 'Check public BTCUSD endpoints'
        run: python research/probe.py --output "$RUNNER_TEMP/pancakequant-check/public"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checked-source-${{ github.sha }}
          path: ${{ runner.temp }}/pancakequant-check/
          if-no-files-found: error
          retention-days: 30

  preserve-native-history:
    if: github.event.head_commit.message == 'Preserve native BTCUSD artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Download, commit and read back exact native history artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=717841c3267f5de40d0c0b103aeff3c067054eb7752ccf5b8cc1bcad11228159
          target_branch=evidence/native-btcusd-20260920
          target_path=evidence/native-btcusd-history-6f5ba384.zip
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/10617971281/zip" \
            --output "$RUNNER_TEMP/native.zip"
          echo "$expected  $RUNNER_TEMP/native.zip" | sha256sum -c -

          if git ls-remote --exit-code --heads origin "$target_branch" >/dev/null 2>&1; then
            git fetch --no-tags origin "$target_branch"
            git show FETCH_HEAD:"$target_path" > "$RUNNER_TEMP/remote.zip"
            echo "$expected  $RUNNER_TEMP/remote.zip" | sha256sum -c -
            exit 0
          fi

          git checkout --orphan "$target_branch"
          git rm -rf .
          mkdir -p evidence
          cp "$RUNNER_TEMP/native.zip" "$target_path"
          cat > evidence/README.md <<'EOF'
          # Native BTCUSD historical evidence

          Exact GitHub Actions artifact produced by Pancakequant acquisition run
          35548881482 from code SHA 6f5ba384baf0c594b2ba8c1c73dbac6ce4f0683b.

          Public source: Bybit official api.manepa.jp, BTCUSD InversePerpetual.
          Coverage: 2019-12-11 UTC through 2026-09-20 UTC exclusive.
          Base interval: native 60-minute trade + mark bars; native funding events.
          The archive includes raw V5 response pages, normalized shards, v5-inventory.json
          and v5-result.json. This branch is evidence storage and is not merged into main.
          EOF
          echo "$expected  native-btcusd-history-6f5ba384.zip" > evidence/SHA256SUMS
          git add evidence
          git -c user.name=pancakequant-evidence \
              -c user.email=actions@users.noreply.github.com \
              commit -m "Preserve native BTCUSD history artifact"
          git push origin "HEAD:refs/heads/$target_branch"

          git fetch --no-tags origin "$target_branch"
          git show FETCH_HEAD:"$target_path" > "$RUNNER_TEMP/remote.zip"
          echo "$expected  $RUNNER_TEMP/remote.zip" | sha256sum -c -
