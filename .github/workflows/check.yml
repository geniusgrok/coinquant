name: Check
on:
  push:
    branches: [main, research/on-demand-btc-20260920]
    paths:
      - 'pancakequant/**'
      - 'tests/**'
      - 'main.py'
      - 'config.example.json'
      - 'research/**'
      - '.github/workflows/check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pancakequant-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Compile and run offline checks
        run: |
          python -m compileall -q pancakequant research tests
          python -m unittest discover -s tests -v
      - name: One requested public Binance archive remainder
        if: github.event.head_commit.message == 'Acquire missing Binance public archives'
        run: python -m research.acquire_binance --request research/binance-acquisition-request.json --output "$RUNNER_TEMP/binance-remainder"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && github.event.head_commit.message == 'Acquire missing Binance public archives'
        with:
          name: binance-native-remainder-${{ github.sha }}
          path: ${{ runner.temp }}/binance-remainder/
          if-no-files-found: error
          retention-days: 30
