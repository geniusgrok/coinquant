name: T20 official minute acquisition
on:
  push:
    branches: [research/t20-official-minute-acquisition-20260923]
permissions:
  contents: read
concurrency:
  group: t20-official-minute-acquisition
  cancel-in-progress: true
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        year: ['2020', '2021', '2022', '2023']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Read-only official archives, checksums, ZIP and minute continuity
        run: |
          python research/t20_bulk_acquire.py \
            --year ${{ matrix.year }} \
            --request research/t20_prior_day_request.json \
            --output "$RUNNER_TEMP/t20-prior-${{ matrix.year }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: t20-prior-${{ matrix.year }}
          path: ${{ runner.temp }}/t20-prior-${{ matrix.year }}/
          compression-level: 0
          retention-days: 3
          if-no-files-found: warn
