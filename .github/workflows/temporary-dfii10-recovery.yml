name: Temporary DFII10 official download
on:
  push:
    branches: [research/dfii10-causal-20260924]
    paths: [.github/workflows/temporary-dfii10-recovery.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch official historical vintages with response audit
        run: python research/dfii10_acquire.py recovered/alfred
      - uses: actions/upload-artifact@v4
        with:
          name: dfii10-audit
          path: recovered/alfred/*
          compression-level: 0
          retention-days: 2
