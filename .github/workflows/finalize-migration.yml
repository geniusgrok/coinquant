name: Finalize Coinquant Migration
on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-migration.yml]
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'geniusgrok/coinquant'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Update repository identity and verify remote files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import subprocess
          import tarfile
          
          SOURCE = 'f94276236c7a8fa5e2551405822d575be5438a47'
          DOCS = ['AGENTS.md', 'README.md', 'PROJECT_STATE.md', 'HANDOFF_PROMPT.md']
          
          def rewrite(root):
              p = root / 'AGENTS.md'
              text = p.read_text()
              assert text.startswith('# Pancakequant engineering rules\n')
              text = text.replace('# Pancakequant engineering rules', '# Coinquant engineering rules', 1)
              text = text.replace('Repository: ychenracing/pancakequant.',
                  'Repository: geniusgrok/coinquant.\n\n'
                  '## Repository migration: 2026-09-23 (Asia/Tokyo)\n\n'
                  'The user migrated this project from ychenracing/pancakequant to geniusgrok/coinquant. '
                  'Use the personal GitHub connection (geniusgrok) for current repository work. '
                  'The source repository is preserved and must not be modified for coinquant tasks. '
                  'Original branches, tags, commits and research evidence retain their identities. '
                  'The Python package and PANCAKEQUANT environment-variable names remain unchanged; '
                  'this migration does not change strategy, configuration, trading permissions or economic qualification.', 1)
              p.write_text(text)
              p = root / 'README.md'
              text = p.read_text()
              assert text.startswith('# Pancakequant\n')
              p.write_text(text.replace('# Pancakequant\n', '# Coinquant\n\n'
                  '当前仓库为 `geniusgrok/coinquant`，由 `ychenracing/pancakequant` 迁移而来。'
                  '后续开发使用 personal / geniusgrok 连接；旧仓库保留，不自动同步或继续写入。'
                  'Python 包名、命令和 `PANCAKEQUANT_*` 环境变量保持不变，迁移不改变策略及交易权限。\n\n'
                  '```sh\ngit clone https://github.com/geniusgrok/coinquant.git\ncd coinquant\n```\n', 1))
              p = root / 'HANDOFF_PROMPT.md'
              text = p.read_text()
              text = text.replace('# Pancakequant：基于 main 继续', '# Coinquant：基于 main 继续', 1)
              text = text.replace('继续 ychenracing/pancakequant，全程中文。',
                  '继续 geniusgrok/coinquant，使用 personal / geniusgrok GitHub 连接，全程中文。', 1)
              marker = '\n先读取实时main、'
              assert marker in text
              text = text.replace(marker, '\n仓库已由 ychenracing/pancakequant 迁移；旧仓库保留，不再作为本项目写入目标。'
                  '全部原始分支、1.0.0标签、提交历史及发布说明已保全并回读核验；包名和环境变量不改名。'
                  '迁移与核验记录见 PROJECT_STATE.md。外置Library原件仍按原索引读取，本次没有将其重新上传为Git对象。\n' + marker, 1)
              p.write_text(text)
              p = root / 'PROJECT_STATE.md'
              text = p.read_text()
              title, rest = text.split('\n', 1)
              note = '''
          ## 仓库迁移：2026-09-23（Asia/Tokyo）
          
          当前仓库为 `geniusgrok/coinquant`，后续使用 personal / geniusgrok 连接及实时 main。源 `ychenracing/pancakequant` 保留且未修改，不作为本项目后续写入目标。
          
          迁移固定源 main：`f94276236c7a8fa5e2551405822d575be5438a47`；原始文件树：`32319ddb37f6dc8b7bdb5d8ade6805f50a45b417`。源 main 的700个文件、全部261个可达提交、三个历史研究/证据分支与1.0.0标签均已保存。目标提交 `0442806ae3d59c7618ddbfc046cef2930b3fc6c1` 与该源文件树完全一致；随后只修改本文件、AGENTS.md、README.md和HANDOFF_PROMPT.md中的迁移身份与说明，不改代码、配置或历史经济证据。
          
          独立克隆目标后，对全部2130个原始Git对象、27,395,719字节逐字节比较，同时核验SHA-256与Git对象ID。验证运行：`35752465121`；完整Git bundle与逐对象清单：该运行的 `pancakequant-migration-evidence` artifact（30天保留）。原始对象同时永久保存在目标仓库历史中，不依赖artifact续存。1.0.0发布说明已逐字节回读一致，原发布没有附件。源仓库的PR/Issue及历史Actions记录未重建，仍留在源仓库；Library外置原件未在此次Git迁移中重新上传。
          
          目标源码提交0442806的Check运行 `35752651439` 成功。后续文档调整不影响该代码验证结果；没有重新运行经济回测，不改变150%/<50%资格，不接触凭据，不执行真实或Testnet交易。临时迁移发布器在收尾时移除，正常CI仍为原只读Check。
          '''
              p.write_text(title + '\n' + note + rest)
          
          if __name__ == '__main__':
              root = Path.cwd()
              assert os.environ['GITHUB_REPOSITORY'] == 'geniusgrok/coinquant'
              def git(*args, cwd=root):
                  return subprocess.check_output(['git', *args], cwd=cwd).decode().strip()
              assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
              assert git('diff', '--name-only', SOURCE, 'HEAD') == '.github/workflows/finalize-migration.yml'
              rewrite(root)
              assert set(git('diff', '--name-only').splitlines()) == set(DOCS)
              git('diff', '--check')
              git('config', 'user.name', 'coinquant migration')
              git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
              git('add', '--', *DOCS)
              git('commit', '-m', 'docs: set coinquant repository identity and migration recovery state')
              head = git('rev-parse', 'HEAD')
              git('push', 'origin', 'HEAD:main')
              destination = root / 'remote-readback'
              git('clone', '--no-checkout', 'https://github.com/geniusgrok/coinquant.git', str(destination))
              git('checkout', '--detach', head, cwd=destination)
              assert git('rev-parse', 'HEAD^{tree}') == git('rev-parse', 'HEAD^{tree}', cwd=destination)
              files = git('ls-files', '-z').split('\0')
              manifest = []
              for name in filter(None, files):
                  local = (root / name).read_bytes()
                  remote = (destination / name).read_bytes()
                  assert local == remote, name
                  oid = hashlib.sha1(f'blob {len(local)}\0'.encode() + local).hexdigest()
                  assert oid == git('rev-parse', f'HEAD:{name}')
                  manifest.append({'path': name, 'length': len(local), 'git_oid': oid, 'sha256': hashlib.sha256(local).hexdigest()})
              out = root / 'final-evidence'
              out.mkdir()
              (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
              (out / 'summary.json').write_text(json.dumps({'verified_commit': head, 'tree': git('rev-parse', 'HEAD^{tree}'), 'files_byte_verified': len(manifest), 'document_changes': DOCS, 'pending_cleanup': '.github/workflows/finalize-migration.yml'}, indent=2) + '\n')
              with tarfile.open(out / 'workspace.tar.gz', 'w:gz') as archive:
                  for name in filter(None, files):
                      archive.add(destination / name, arcname=name, recursive=False)
              with (out / 'workspace.tar.gz').open('rb') as f:
                  digest = hashlib.file_digest(f, 'sha256').hexdigest()
              (out / 'workspace.sha256').write_text(digest + '  workspace.tar.gz\n')
              print('FINAL_DOCS_VERIFIED', head, len(manifest))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coinquant-final-readback
          path: final-evidence/
          retention-days: 30
          if-no-files-found: error
