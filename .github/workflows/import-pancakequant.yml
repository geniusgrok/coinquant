name: Verify Pancakequant Migration
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-pancakequant.yml]
permissions:
  contents: write
concurrency:
  group: coinquant-initial-migration
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'geniusgrok/coinquant'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify every original object and copy historical release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .migration/verify.py
      - name: Preserve original bundle and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pancakequant-migration-evidence
          path: migration-evidence/
          if-no-files-found: error
          retention-days: 30
