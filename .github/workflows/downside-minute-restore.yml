name: Temporary public downside minute restore
on:
  push:
    branches: [research/downside-channel-20260924]
    paths:
      - evidence/downside-channel-20260924/missing_*.json
      - .github/workflows/downside-minute-restore.yml
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: downside-minutes-*
          run-id: 35977571261
          github-token: ${{ github.token }}
          path: evidence/downside-channel-20260924/minutes
      - name: Check every requested official original before saving
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('evidence/downside-channel-20260924/minutes')
          count = 0
          for i in range(4):
              batch = root/f'downside-minutes-{i}'
              requested = json.loads((Path('evidence/downside-channel-20260924')/f'missing_{i}.json').read_text())['requests']
              receipts = json.loads((batch/'RECEIPT.json').read_text())
              verified = {(r['day'],r['kind']) for r in receipts if r['status'] == 'verified'}
              expected = {(r['day'],kind) for r in requested for kind in ('klines','markPriceKlines')}
              if i == 0:
                  expected.remove(('2020-12-17','markPriceKlines'))
                  rejected = [r for r in receipts if r['status'] == 'rejected_original']
                  assert {r['path'] for r in rejected} == {
                      'daily/markPriceKlines/BTCUSDT/1m/BTCUSDT-1m-2020-12-17.zip',
                      'monthly/markPriceKlines/BTCUSDT/1m/BTCUSDT-1m-2020-12.zip'}
                  assert all(r['day'] == '2020-12-17' and r['kind'] == 'markPriceKlines' for r in rejected)
              else:
                  assert all(r['status'] == 'verified' for r in receipts)
              assert verified == expected
              for r in receipts:
                  if r['status'] not in ('verified','rejected_original'):
                      raise ValueError('unclassified public minute response')
                  target = batch/('data/futures/um' if r['status']=='verified' else 'rejected')/r['path']
                  raw = target.read_bytes()
                  assert len(raw) == r['bytes'] and hashlib.sha256(raw).hexdigest() == r['sha256']
                  assert (target.parent/(target.name+'.CHECKSUM')).read_text().split()[0].lower() == r['sha256']
              count += len(verified)
          assert count == 301
          print('Verified official archives:',count,'; invalid official mark originals retained: 2')
          PY
      - name: Preserve complete files on research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/downside-channel-20260924/minutes
          # The repository ignores directories named data/ globally; these
          # checked official originals must be added explicitly.
          git add -f evidence/downside-channel-20260924/minutes/downside-minutes-*/data/futures/um
          git diff --cached --quiet || git commit -m 'Preserve verified downside minute originals'
          git push origin HEAD:research/downside-channel-20260924
