name: UC4 temporary official minute recovery
on:
  push:
    branches: [research/uc4-evidence-fix-20260924]
    paths: [.github/workflows/uc4-minute-recovery.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/uc4-evidence-fix-20260924
      - name: Download and validate official 2021-04-18 minute originals
        run: |
          python3 - <<'PY'
          import csv, hashlib, io, pathlib, urllib.request, zipfile
          days=('2020-06-02','2020-09-02','2020-09-21','2021-01-26','2021-04-04')
          root=pathlib.Path('evidence/unified-channel-20260924/minutes/daily')
          for day in days:
           for kind in ('klines','markPriceKlines'):
              name=f'BTCUSDT-1m-{day}.zip'
              relative=f'daily/{kind}/BTCUSDT/1m/{name}'
              monthly=day=='2021-01-26' and kind=='markPriceKlines'
              if monthly:
                  name='BTCUSDT-1m-2021-01.zip'
                  relative=f'monthly/{kind}/BTCUSDT/1m/{name}'
              base='https://data.binance.vision/data/futures/um/'
              def get(url):
                  with urllib.request.urlopen(url,timeout=60) as response:
                      if response.url != url or response.status != 200: raise ValueError(f'unexpected official response {url}')
                      return response.read()
              raw=get(base+relative)
              checksum=get(base+relative+'.CHECKSUM')
              actual=hashlib.sha256(raw).hexdigest()
              if checksum.decode().split()[0].lower()!=actual: raise ValueError(f'checksum mismatch {kind}')
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  if len(archive.namelist())!=1 or archive.testzip() is not None: raise ValueError(f'bad archive {kind}')
                  rows=list(csv.reader(io.TextIOWrapper(archive.open(archive.namelist()[0]))))
              if rows and not rows[0][0].isdigit(): rows=rows[1:]
              from datetime import datetime,timezone
              start=int(datetime.fromisoformat(day).replace(tzinfo=timezone.utc).timestamp()*1000)
              selected=[row for row in rows if start<=int(row[0])<start+86400000]
              if [int(row[0]) for row in selected]!=list(range(start,start+86400000,60000)):
                  raise ValueError(f'incomplete minutes {kind}')
              if any(int(row[6])!=int(row[0])+59999 for row in rows):raise ValueError(f'bad minute close {kind}')
              target=(root.parent/'monthly' if monthly else root)/kind/'BTCUSDT'/'1m'/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(raw)
              pathlib.Path(str(target)+'.CHECKSUM').write_bytes(checksum)
              print(kind,len(raw),actual,flush=True)
          PY
      - name: Commit verified originals to research branch
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evidence/unified-channel-20260924/minutes/daily
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve verified April 18 UC4 minute originals'
            git push origin HEAD:research/uc4-evidence-fix-20260924
          fi
      - name: Read back source bytes and Git blob IDs from remote ref
        run: |
          git fetch origin refs/heads/research/uc4-evidence-fix-20260924
          python3 - <<'PY'
          import hashlib,pathlib,subprocess
          root=pathlib.Path('evidence/unified-channel-20260924/minutes')
          days=('2020-06-02','2020-09-02','2020-09-21','2021-01-26','2021-04-04','2021-04-18')
          for day in days:
              for kind in ('klines','markPriceKlines'):
                  monthly=day=='2021-01-26' and kind=='markPriceKlines'
                  date=day[:7] if monthly else day
                  folder='monthly' if monthly else 'daily'
                  p=root/folder/kind/'BTCUSDT'/'1m'/f'BTCUSDT-1m-{date}.zip'
                  raw=p.read_bytes()
                  expected=pathlib.Path(str(p)+'.CHECKSUM').read_text().split()[0]
                  if hashlib.sha256(raw).hexdigest()!=expected:raise ValueError(f'local checksum {p}')
                  for file in (p,pathlib.Path(str(p)+'.CHECKSUM')):
                      local=file.read_bytes()
                      remote=subprocess.check_output(['git','show',f'FETCH_HEAD:{file.as_posix()}'])
                      if local!=remote:raise ValueError(f'remote byte mismatch {file}')
                      oid=subprocess.check_output(['git','rev-parse',f'FETCH_HEAD:{file.as_posix()}'],text=True).strip()
                      blob=hashlib.sha1(b'blob '+str(len(local)).encode()+b'\\0'+local).hexdigest()
                      if oid!=blob:raise ValueError(f'Git blob OID mismatch {file}')
                      print(file,len(local),hashlib.sha256(local).hexdigest(),oid)
          PY
