name: Temporary OI original archive preservation
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/probe-oi-archive.yml']
permissions:
  contents: write
jobs:
  archive:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/oi-causal-probe-20260923'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: research/oi-causal-probe-20260923
      - name: Acquire and verify official OI original files
        run: |
          python3 research/oi_archive_acquire.py /tmp/oi-originals
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          folder = Path('/tmp/oi-originals')
          manifest = json.loads((folder / 'MANIFEST.json').read_text())
          count = Counter(row['status'] for row in manifest['days'])
          expected = {'missing_checksum_404': 244, 'verified_complete': 1140,
                      'verified_incomplete': 68, 'quarantined_conflict': 9}
          if len(manifest['days']) != 1461 or count != expected:
              raise ValueError(f'coverage changed; inspect before preservation: {count}')
          destination = Path('evidence/oi-archive-20260923/development-originals')
          destination.mkdir(parents=True, exist_ok=True)
          for filename in ['MANIFEST.json', 'OI_DEVELOPMENT_ORIGINALS.tar.gz']:
              (destination / filename).write_bytes((folder / filename).read_bytes())
          PY
      - name: Preserve verified bytes on the research branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/oi-archive-20260923/development-originals
          git commit -m 'Preserve complete official OI development originals'
          git push origin HEAD:refs/heads/research/oi-causal-probe-20260923
