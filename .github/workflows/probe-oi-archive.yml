name: Temporary public OI archive availability probe
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/probe-oi-archive.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Probe public Binance USD-M BTCUSDT metrics CHECKSUM files
        shell: bash
        run: |
          set -u
          for day in 2020-01-01 2020-06-01 2021-01-01 2022-01-01 2023-01-01 2025-01-01 2026-09-18; do
            url="https://data.binance.vision/data/futures/um/daily/metrics/BTCUSDT/BTCUSDT-metrics-${day}.zip.CHECKSUM"
            path="${RUNNER_TEMP}/BTCUSDT-metrics-${day}.zip.CHECKSUM"
            status=$(curl --silent --show-error --location --connect-timeout 8 --max-time 15 --output "$path" --write-out '%{http_code}' "$url") || status="TRANSPORT_ERROR"
            echo "${day} HTTP=${status}"
            if [ "$status" = 200 ]; then
              wc -c "$path"
              sha256sum "$path"
              head -c 512 "$path"
              echo
            fi
          done
